[project]
name = "non-fidarti-di-me"
version = "0.1.0"
description = "Libro: Non Fidarti di Me — toolchain di build, figure e lab"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.43",
    "numpy>=2.5",
    "scipy>=1.16",
    "matplotlib>=3.11",
    "pyarrow>=25.0",
    "ipykernel>=7.3",
    "nbformat>=5.11",
    "nbclient>=0.11",
    "jupyter>=1.1",
    "jupytext>=1.19",
    "segno>=1.6",
]

[project.optional-dependencies]
ingest = [
    "requests>=2.32",
    "requests-cache>=1.3",
    "yfinance>=1.6",
    "ccxt>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codice/src/cvbook"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
